---
layout: default
body_class: page-blog
---
<div class="wrap">
  <header class="blog-head">
    <p class="label" style="margin-bottom:18px"><a href="{{ '/blog/' | relative_url }}">~/blog</a> / archivo</p>
    <h1 data-decode>Archivo</h1>
  </header>
  <div style="padding-bottom:112px">
    {%- assign years = site.posts | group_by_exp: 'p', "p.date | date: '%Y'" -%}
    {%- for y in years %}
    <section class="year">
      <h2>{{ y.name }}</h2>
      <div class="plist">
        {%- for post in y.items %}
        <a class="prow" href="{{ post.url | relative_url }}">
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%d.%m' }}</time>
          <h3>{{ post.title }}</h3>
          <span class="prow__arr" aria-hidden="true">↗</span>
        </a>
        {%- endfor %}
      </div>
    </section>
    {%- endfor %}
  </div>
</div>
